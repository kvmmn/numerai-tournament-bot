name: Agentic Winning OS

on:
  pull_request:
    paths:
      - "command_center/backend/**"
      - ".github/workflows/agentic-winning-os.yml"
  push:
    branches: [main]
    paths:
      - "command_center/backend/**"
      - ".github/workflows/agentic-winning-os.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command_center/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: command_center/backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app automation tests
